plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "underdeep" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        // Dedicated server. Automated self-tests pass -PrunDir=... -Pselftest=<dir> [-PselftestPhase=reload]
        // [-PselftestOrder=reverse] (see scripts/selftest.sh and docs/TESTING.md).
        server {
            runDir project.findProperty("runDir") ?: "run-server"
            vmArg "-Xmx6G"
            if (project.hasProperty("mobstudy")) {
                vmArg "-Dunderdeep.mobstudy=${project.property('mobstudy')}"
                vmArg "-Dunderdeep.mobstudy.sites=${project.property('mobstudySites')}"
                vmArg "-Dunderdeep.mobstudy.seconds=${project.findProperty('mobstudySeconds') ?: '60'}"
            }
            if (project.hasProperty("selftest")) {
                vmArg "-Dunderdeep.selftest=${project.property('selftest')}"
                vmArg "-Dunderdeep.selftest.phase=${project.findProperty('selftestPhase') ?: 'create'}"
                vmArg "-Dunderdeep.selftest.order=${project.findProperty('selftestOrder') ?: 'forward'}"
                vmArg "-Dunderdeep.selftest.expectVanilla=${project.findProperty('expectVanilla') ?: 'false'}"
                vmArg "-Dunderdeep.selftest.suite=${project.findProperty('selftestSuite') ?: 'full'}"
                vmArg "-Dunderdeep.zoo=${project.findProperty('zoo') ?: 'false'}"
                vmArg "-Dunderdeep.gallery=${project.findProperty('gallery') ?: 'false'}"
            }
        }
        client {
            runDir project.findProperty("clientRunDir") ?: "run-client"
            if (project.hasProperty("joinServer")) {
                programArgs "--quickPlayMultiplayer", project.property('joinServer').toString()
            }
            if (project.hasProperty("createWorldTest")) {
                vmArg "-Dunderdeep.createWorldTest=${project.property('createWorldTest')}"
            }
            if (project.hasProperty("tour")) {
                vmArg "-Dunderdeep.tour=${project.property('tour')}"
                programArgs "--quickPlaySingleplayer", project.property('tourWorld').toString()
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

test {
    useJUnitPlatform()
    systemProperty 'underdeep.previews', System.getProperty('underdeep.previews', 'false')
    systemProperty 'underdeep.distribution', System.getProperty('underdeep.distribution', 'false')
    testLogging.showStandardStreams = true
    maxHeapSize = '2G'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
