# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Fabric / Minecraft (verified against maven.fabricmc.net and meta.fabricmc.net)
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.17.3
loom_version=1.11.8
fabric_version=0.116.18+1.21.1

# Mod
mod_version=0.12.2-stage12-checkpoint
maven_group=dev.underdeep
archives_base_name=underdeep

# Network resilience: the build host rate-limits Maven Central bursts (HTTP 429).
systemProp.org.gradle.internal.repository.max.retries=12
systemProp.org.gradle.internal.repository.initial.backoff=2500
